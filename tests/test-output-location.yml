name: Test msys2-location output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          msystem: MINGW64
          platform-check-severity: warn
          release: false
          cache: false
        continue-on-error: true
      - name: Assert msys2-location output is defined (may be empty on non-Windows)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LOCATION: ${{ steps.action.outputs.msys2-location }}
        run: |
          echo "outcome: $OUTCOME"
          echo "msys2-location: $LOCATION"
          # On non-Windows the action warns and exits early; outcome should be success
          # and location may be empty — that is acceptable
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should not fail with platform-check-severity=warn"
            exit 1
          fi
          echo "PASS: action completed; msys2-location='$LOCATION'"
