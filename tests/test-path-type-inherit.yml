name: Test path-type inherit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          msystem: MINGW64
          path-type: inherit
          platform-check-severity: warn
          release: false
          cache: false
        continue-on-error: true
      - name: Assert action completed with inherit path-type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # On Linux, the action should complete (warn and succeed or fail gracefully).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' for path-type=inherit"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
