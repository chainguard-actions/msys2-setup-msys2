name: Test msystem UCRT64 variant
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          msystem: UCRT64
          platform-check-severity: warn
          release: false
      - name: Assert action ran with UCRT64 msystem
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MSYS2_LOC: ${{ steps.action.outputs.msys2-location }}
        run: |
          echo "outcome: $OUTCOME"
          echo "msys2-location: $MSYS2_LOC"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with UCRT64"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully on non-Windows runner (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
