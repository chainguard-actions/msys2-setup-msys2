name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          msystem: MINGW64
          path-type: minimal
          update: false
          install: false
          release: true
          platform-check-severity: warn
        continue-on-error: true
      - name: Assert action ran without unexpected crash
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # On Linux, the action is expected to warn about platform incompatibility
          # and either succeed (warn) or fail gracefully. Both outcomes are acceptable.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (expected on non-Windows)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
