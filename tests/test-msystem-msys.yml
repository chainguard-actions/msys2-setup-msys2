name: Test msystem MSYS
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          msystem: MSYS
          path-type: minimal
          update: false
          release: false
          cache: false
          platform-check-severity: warn
      - name: Assert action completed with MSYS
        run: |
          echo "Action completed with msystem=MSYS"
          echo "msys2-location: '${{ steps.action.outputs.msys2-location }}'"
          echo "PASS: action did not fatally exit with MSYS variant"
