name: Test platform-check-severity fatal (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          platform-check-severity: fatal
        continue-on-error: true
      - name: Assert action fails on non-Windows with fatal severity
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # On Linux, with platform-check-severity=fatal (default), the action
          # should fail because MSYS2 is Windows-only.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' on non-Windows runner, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on non-Windows runner with fatal severity"
