name: Test platform-check-severity warn
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          msystem: MINGW64
          platform-check-severity: warn
          release: false
          cache: false
        continue-on-error: true
      - name: Assert action completed (warn mode does not fatal)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should not fail with platform-check-severity=warn on non-Windows"
            exit 1
          fi
          echo "PASS: action completed without fatal error"
