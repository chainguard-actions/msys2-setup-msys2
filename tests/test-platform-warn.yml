name: Test platform-check-severity warn
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          msystem: MINGW64
          platform-check-severity: warn
          release: false
          cache: false
        continue-on-error: true
      - name: Assert action ran (warn mode allows continuation on non-Windows)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # On Linux, the action should either warn and succeed, or fail gracefully.
          # With platform-check-severity: warn, the action should not fatally crash
          # the runner itself. The step may succeed or fail, but the workflow continues.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (workflow continued)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
