name: Test platform-check-severity fatal on non-Windows
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          msystem: MINGW64
          platform-check-severity: fatal
      - name: Assert action fails on non-Windows with fatal severity
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on non-Windows runner with platform-check-severity=fatal"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (running on Windows or compatible environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
