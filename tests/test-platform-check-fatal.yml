name: Test platform-check-severity fatal
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          msystem: MINGW64
          platform-check-severity: fatal
          release: false
          cache: false
        continue-on-error: true
      - name: Assert action failed on non-Windows platform
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with platform-check-severity=fatal on Linux, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on non-Windows platform with fatal severity"
