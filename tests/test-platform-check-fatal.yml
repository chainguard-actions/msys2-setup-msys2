name: Test platform-check-severity fatal on non-Windows
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          platform-check-severity: fatal
          release: false
          cache: false
        continue-on-error: true
      - name: Assert action failed due to incompatible platform
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # On Linux with fatal severity, the action should fail
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-Windows with platform-check-severity=fatal, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on non-Windows platform"
